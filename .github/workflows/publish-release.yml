---
name: Publish stable desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable semantic version tag
        required: true
        type: string
      target_commit:
        description: Exact commit SHA to build and release
        required: true
        type: string
      replace_existing_release:
        description: Replace this exact stable tag only after every build and validation passes
        required: true
        default: false
        type: boolean

concurrency:
  group: stable-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and validate Windows x64
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit }}
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true

      - name: Install frozen dependencies and Inno Setup
        shell: pwsh
        run: |
          uv sync --extra build --frozen
          choco install innosetup --yes --no-progress

      - name: Validate version and source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          if ($env:TARGET_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'target_commit must be a full 40-character lowercase commit SHA' }
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:TARGET_COMMIT) { throw "Checked out $actualCommit instead of $env:TARGET_COMMIT" }
          $version = & .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag $env:RELEASE_TAG does not match project version v$version" }
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src\vram_radar\web\app.js
          node --check src\vram_radar\web\localization.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m compileall -q src tests tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools\benchmark_webview_ui.py --timeout-seconds 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate packaged app
        shell: pwsh
        env:
          VRAM_RADAR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          .\Build-VramRadar.ps1 -SkipSync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools\validate_packaged_askpass.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe tools\validate_packaged_tray.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeHome = Join-Path $env:RUNNER_TEMP 'vram-radar-empty-profile'
          $arguments = @('--home', $smokeHome, '--profile', 'release-smoke', '--no-auto-import')
          $show = Start-Process -FilePath '.\dist\VRAMRadar\VRAMRadar.exe' -ArgumentList ($arguments + '--show-paths') -Wait -PassThru
          if ($show.ExitCode -ne 0) { throw "Packaged --show-paths failed with exit code $($show.ExitCode)" }
          $gui = Start-Process -FilePath '.\dist\VRAMRadar\VRAMRadar.exe' -ArgumentList ($arguments + '--gui-smoke') -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "Packaged --gui-smoke failed with exit code $($gui.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $smokeHome 'config\profiles\release-smoke.toml')) {
            throw 'Empty packaged smoke unexpectedly persisted a Profile'
          }

      - name: Build stable-path installer and release asset
        shell: pwsh
        run: |
          $version = & .\.venv\Scripts\python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          .\Build-VramRadar-Installer.ps1 -SkipBundle -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist-installer\VRAMRadar-Setup-$version.exe"
          .\.venv\Scripts\python.exe tools\validate_packaged_update.py $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $installer -Destination (Split-Path -Leaf $installer)
          foreach ($asset in @((Split-Path -Leaf $installer))) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $asset" | Set-Content -NoNewline -Encoding ascii -LiteralPath "$asset.sha256"
          }

      - name: Upload validated Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VRAMRadar-windows-x64
          path: |
            VRAMRadar-Setup-*.exe
            VRAMRadar-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build and validate macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit }}
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --extra build --frozen

      - name: Validate source
        timeout-minutes: 8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "target_commit must be a full 40-character lowercase commit SHA" >&2; exit 2; }
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT" ]] || { echo "Checked-out commit does not match target_commit" >&2; exit 2; }
          version="$(./.venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Release tag $RELEASE_TAG does not match project version v$version" >&2; exit 2; }
          ./.venv/bin/python -m unittest discover -s tests -v
          node --check src/vram_radar/web/app.js
          node --check src/vram_radar/web/localization.js
          ./.venv/bin/python -m compileall -q src tests tools
          ./.venv/bin/python tools/benchmark_webview_ui.py --timeout-seconds 120
          bash -n Build-VramRadar-macOS.sh tools/package_macos_release.sh tools/package_combined_macos_release.sh

      - name: Build native app bundle
        env:
          VRAM_RADAR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash Build-VramRadar-macOS.sh --skip-sync --target-arch=${{ matrix.arch }}

      - name: Validate packaged Cocoa app
        env:
          VRAM_RADAR_EXPECTED_MACOS_ARCH: ${{ matrix.arch }}
          VRAM_RADAR_RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./.venv/bin/python tools/validate_macos_bundle.py

      - name: Package validated native app
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: bash tools/package_macos_release.sh

      - name: Upload validated macOS release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VRAMRadar-macos-${{ matrix.arch }}
          path: |
            VRAMRadar-*-macos-${{ matrix.arch }}.zip
            VRAMRadar-*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  macos_combined:
    name: Combine validated macOS applications
    needs: macos
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit }}
          persist-credentials: false

      - name: Download both validated native macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: VRAMRadar-macos-*
          path: native-assets
          merge-multiple: true

      - name: Verify and combine native macOS applications
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash tools/package_combined_macos_release.sh native-assets

      - name: Upload combined macOS release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VRAMRadar-macos-combined
          path: |
            VRAMRadar-*-macos.zip
            VRAMRadar-*-macos.zip.sha256
          if-no-files-found: error
          retention-days: 30

  macos_combined_validate:
    name: Validate final macOS package on ${{ matrix.arch }}
    needs: macos_combined
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            app: VRAM Radar (Apple Silicon).app
          - arch: x86_64
            runner: macos-15-intel
            app: VRAM Radar (Intel).app
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit }}
          persist-credentials: false

      - name: Install frozen validation environment
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --extra build --frozen

      - name: Download final combined macOS asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: VRAMRadar-macos-combined
          path: combined-assets

      - name: Extract final public archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p combined-extracted
          ditto -x -k "combined-assets/VRAMRadar-$version-macos.zip" combined-extracted
          test -d "combined-extracted/VRAM Radar macOS/${{ matrix.app }}"

      - name: Launch and validate final packaged application
        env:
          VRAM_RADAR_EXPECTED_MACOS_ARCH: ${{ matrix.arch }}
          VRAM_RADAR_RELEASE_TAG: ${{ inputs.release_tag }}
          VRAM_RADAR_MACOS_BUNDLE: combined-extracted/VRAM Radar macOS/${{ matrix.app }}
        run: ./.venv/bin/python tools/validate_macos_bundle.py

  publish:
    name: Create stable GitHub Release
    needs: [windows, macos_combined_validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes from exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_commit }}
          persist-credentials: false

      - name: Download validated Windows release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: VRAMRadar-windows-x64
          path: release-assets

      - name: Download combined macOS release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: VRAMRadar-macos-combined
          path: release-assets

      - name: Verify checksums and prepare public downloads
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-assets
          version="${RELEASE_TAG#v}"
          public_assets=(
            "VRAMRadar-Setup-$version.exe"
            "VRAMRadar-$version-macos.zip"
          )
          checksum_assets=(
            "VRAMRadar-Setup-$version.exe.sha256"
            "VRAMRadar-$version-macos.zip.sha256"
          )
          expected=("${public_assets[@]}" "${checksum_assets[@]}")
          for asset in "${expected[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 2; }
          done
          actual_count="$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$actual_count" == "${#expected[@]}" ]] || { echo "Unexpected release asset count: $actual_count" >&2; find . -maxdepth 1 -type f -print; exit 2; }
          sha256sum -c -- ./*.sha256
          public_dir="../public-release-assets"
          mkdir -p "$public_dir"
          cp -- "${public_assets[@]}" "$public_dir/"
          public_count="$(find "$public_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$public_count" == "${#public_assets[@]}" ]] || { echo "Unexpected public download count: $public_count" >&2; exit 2; }

      - name: Create or safely replace stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          REPLACE_EXISTING_RELEASE: ${{ inputs.replace_existing_release }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "target_commit must be a full 40-character lowercase commit SHA" >&2; exit 2; }
          [[ "$(git rev-parse HEAD)" == "$TARGET_COMMIT" ]] || { echo "Release notes checkout does not match target_commit" >&2; exit 2; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_tag must be a stable semantic version such as v0.4.0" >&2; exit 2; }
          notes_file="docs/release-notes-${RELEASE_TAG}.md"
          [[ -f "$notes_file" ]] || { echo "Release notes are missing: $notes_file" >&2; exit 2; }
          created_release_id=""
          replacement_started="0"
          rollback_dir="$RUNNER_TEMP/vram-radar-release-rollback"
          restore_previous_release() (
            set +e
            [[ "$replacement_started" == "1" ]] || exit 0
            if [[ "$created_release_id" =~ ^[0-9]+$ ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null 2>&1
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$(cat "$rollback_dir/tag-commit")" \
              -F force=true >/dev/null || exit 1
            rollback_release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$(cat "$rollback_dir/tag-commit")" \
              -f name="$(jq -r '.name' "$rollback_dir/release.json")" \
              -F body=@"$rollback_dir/body.md" \
              -F draft=true \
              -F prerelease="$(jq -r '.prerelease' "$rollback_dir/release.json")" \
              --jq '.id')" || exit 1
            gh release upload "$RELEASE_TAG" "$rollback_dir/assets"/* --repo "$GITHUB_REPOSITORY" || exit 1
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$rollback_release_id" \
              -F draft=false \
              -F prerelease="$(jq -r '.prerelease' "$rollback_dir/release.json")" \
              -f make_latest=true >/dev/null
          )
          cleanup_failed_draft() (
            set +e
            if [[ "$replacement_started" == "1" ]]; then
              restore_previous_release
              exit $?
            fi
            if [[ "$created_release_id" =~ ^[0-9]+$ ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$created_release_id"
            fi
          )
          trap cleanup_failed_draft ERR
          trap 'cleanup_failed_draft; exit 130' INT TERM
          release_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$RELEASE_TAG" <<<"$release_tags"; then
            if [[ "$REPLACE_EXISTING_RELEASE" != "true" ]]; then
              echo "Release already exists; set replace_existing_release only for an explicitly authorized same-tag replacement" >&2
              exit 2
            fi
            mkdir -p "$rollback_dir/assets"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$rollback_dir/release.json"
            jq -r '.body // ""' "$rollback_dir/release.json" > "$rollback_dir/body.md"
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git rev-parse "$RELEASE_TAG^{commit}" > "$rollback_dir/tag-commit"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$rollback_dir/assets"
            [[ "$(find "$rollback_dir/assets" -maxdepth 1 -type f | wc -l | tr -d ' ')" -gt 0 ]] || { echo "Existing Release backup has no assets" >&2; exit 2; }
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
            replacement_started="1"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_COMMIT" \
              -F force=true >/dev/null
          fi
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          tag_lookup_status=$?
          set -e
          case "$tag_lookup_status" in
            0)
              git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
              [[ "$tag_commit" == "$TARGET_COMMIT" ]] || { echo "Existing tag $RELEASE_TAG points to $tag_commit instead of $TARGET_COMMIT" >&2; exit 2; }
              ;;
            2)
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$TARGET_COMMIT" >/dev/null
              ;;
            *)
              echo "Unable to determine whether tag $RELEASE_TAG exists (git ls-remote exit $tag_lookup_status)" >&2
              false
              ;;
          esac
          created_release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$TARGET_COMMIT" \
            -f name="VRAM Radar ${RELEASE_TAG#v}" \
            -F body=@"$notes_file" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')"
          [[ "$created_release_id" =~ ^[0-9]+$ ]] || { echo "GitHub did not return the created draft Release ID" >&2; exit 2; }
          gh release upload "$RELEASE_TAG" public-release-assets/* \
            --repo "$GITHUB_REPOSITORY"
          uploaded_asset_names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$created_release_id/assets?per_page=100" --jq '.[].name' | sort)"
          expected_asset_names="$(find public-release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$uploaded_asset_names" != "$expected_asset_names" ]]; then
            echo "Uploaded asset set does not match the validated local set" >&2
            diff -u <(printf '%s\n' "$expected_asset_names") <(printf '%s\n' "$uploaded_asset_names") || true
            false
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$created_release_id" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null
          trap - ERR INT TERM
