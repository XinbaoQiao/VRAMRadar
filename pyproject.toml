[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vram-radar"
version = "0.7.0"
description = "Local-first GPU memory monitor for Windows and macOS"
requires-python = ">=3.12,<3.14"
dependencies = [
  "keyring>=25.6,<26",
  "pillow>=11,<13; sys_platform == 'win32'",
  "platformdirs>=4.3,<5",
  "pystray>=0.19.5,<1; sys_platform == 'win32'",
  "pywebview>=5.4,<7",
  "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
build = ["pillow>=11,<13", "pyinstaller>=6.15,<7"]

[project.scripts]
vram-radar = "vram_radar.shell:main"
vram-radar-askpass = "vram_radar.askpass:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vram_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
